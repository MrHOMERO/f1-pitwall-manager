<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitwall Manager - Ferrari Edition</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #ffffff; text-align: center; overflow-x: hidden; }
        
        /* Utilidades de estilo */
        .hidden { display: none !important; }
        .text-ferrari { color: #e10600; }
        .bg-ferrari { background-color: #e10600; }

        /* PANTALLA DE INICIO (Estilo iGP Manager) */
        #splash-screen {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
            background: linear-gradient(180deg, rgba(13, 13, 13, 0.2) 0%, rgba(13, 13, 13, 0.95) 85%),
                        radial-gradient(circle at center, #2a0404 0%, #0d0d0d 100%);
            border-bottom: 4px solid #e10600;
        }

        .brand-badge {
            background: #ffffff;
            color: #000000;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 4px 12px;
            letter-spacing: 2px;
            border-radius: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 0.95;
            margin-bottom: 5px;
        }

        .main-title span {
            color: #e10600;
            display: block;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* Botón estilo Manager */
        .btn-main {
            background: #e10600;
            color: #ffffff;
            border: none;
            width: 85%;
            max-width: 320px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(225, 6, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-main:active {
            transform: scale(0.97);
            background: #b80500;
        }

        /* MENÚ PRINCIPAL (Hub de Mánager) */
        #main-menu {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header de perfil */
        .manager-header {
            background: #161616;
            border-left: 5px solid #e10600;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            text-align: left;
        }

        .manager-info h2 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .manager-info p {
            font-size: 0.8rem;
            color: #888888;
        }

        .currency-badge {
            background: #222222;
            border: 1px solid #333333;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Rejilla del menú de navegación */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .menu-card {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 6px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .menu-card:hover {
            border-color: #e10600;
        }

        .menu-card .icon {
            font-size: 1.8rem;
        }

        .menu-card .label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Banner de Próxima Carrera */
        .next-race-card {
            background: linear-gradient(135deg, #1c1c1c 0%, #111111 100%);
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 15px;
            text-align: left;
            margin-bottom: 15px;
        }

        .race-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: #e10600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .race-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO (SPLASH) -->
    <div id="splash-screen">
        <div class="brand-badge">Scuderia Hub</div>
        <h1 class="main-title">GP MANAGER <span>2026</span></h1>
        <p class="subtitle">Estrategia & Control de Carrera en Tiempo Real</p>
        <button class="btn-main" onclick="entrarAlMenu()">Ingresar al Muro</button>
    </div>

    <!-- MENÚ PRINCIPAL (HUB DE MÁNAGER) -->
    <div id="main-menu" class="hidden">
        
        <!-- Header de Mánager -->
        <div class="manager-header">
            <div class="manager-info">
                <h2>Director de Equipo</h2>
                <p>Scuderia Ferrari</p>
            </div>
            <div class="currency-badge">
                <span class="text-ferrari">RP:</span> <span id="rp-count">1,500</span>
            </div>
        </div>

        <!-- Tarjeta Próxima Carrera -->
        <div class="next-race-card">
            <div class="race-tag">Próximo Evento</div>
            <div class="race-title">GP de Australia (Melbourne)</div>
            <p style="font-size:0.8rem; color:#888;">Condiciones estimadas: Seco / Templado</p>
            <button class="btn-main" style="width:100%; margin-top:12px; padding:12px; font-size:0.9rem;" onclick="prepararEstrategia()">Ir a Estrategia</button>
        </div>

        <!-- Módulo de Accesos Directos estilo iGP -->
        <div class="menu-grid">
            <div class="menu-card">
                <span class="icon">🏎️</span>
                <span class="label">Monoplaza</span>
            </div>
            <div class="menu-card">
                <span class="icon">🛠️</span>
                <span class="label">Taller I+D</span>
            </div>
            <div class="menu-card">
                <span class="icon">📊</span>
                <span class="label">Telemetría</span>
            </div>
            <div class="menu-card">
                <span class="icon">🏆</span>
                <span class="label">Campeonato</span>
            </div>
        </div>

    </div>

    <script>
        function entrarAlMenu() {
            document.getElementById("splash-screen").classList.add("hidden");
            document.getElementById("main-menu").classList.remove("hidden");
        }

        function prepararEstrategia() {
            alert("Siguiente paso: Configurar estrategia de carrera.");
        }
    </script>
</body>
</html>
