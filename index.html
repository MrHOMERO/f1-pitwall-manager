<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pitwall Manager 2026</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #121214; color: #ffffff; padding: 15px; text-align: center; }
        h1 { color: #e10600; margin-bottom: 5px; font-size: 1.6rem; text-transform: uppercase; }
        p { font-size: 0.9rem; color: #a1a1a6; margin-bottom: 15px; }
        .card { background: #1c1c1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .btn { background: #e10600; color: white; border: none; padding: 12px 18px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .btn-upgrade { background: #2c80ff; }
        select { width: 100%; padding: 10px; background: #2c2c2e; color: white; border: 1px solid #444; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }
        .hidden { display: none; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-bottom: 10px; }
        .stat-item { background: #2c2c2e; padding: 8px; border-radius: 6px; font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid #2c2c2e; }
        th { color: #e10600; }
        .user-row { background-color: #3a2020; font-weight: bold; color: #ff6b6b; }
    </style>
</head>
<body>

    <h1>F1 Pitwall Manager</h1>
    <p>Temporada 2026</p>

    <!-- PANTALLA 1: SELECCIÓN -->
    <div id="setup-screen" class="card">
        <h3>Configurar Equipo</h3>
        <br>
        <label>Escudería:</label>
        <select id="team-select" onchange="cargarPilotos()"></select>
        
        <label>Piloto Principal:</label>
        <select id="driver-select"></select>
        
        <button class="btn" onclick="iniciarJuego()">Comenzar Temporada</button>
    </div>

    <!-- PANTALLA 2: DASHBOARD -->
    <div id="game-screen" class="hidden">
        <div class="card">
            <h2 id="user-info" style="color:#e10600;"></h2>
            <p id="rp-display">Puntos RP: 0</p>
            <button class="btn" onclick="simularCarrera()">🏎️ Simular Carrera GP</button>
        </div>

        <!-- TALLER DE MEJORAS -->
        <div class="card">
            <h3>Taller de I+D</h3>
            <br>
            <div id="upgrades-list"></div>
        </div>

        <!-- RESULTADOS DE CARRERA -->
        <div id="results-card" class="card hidden">
            <h3>Resultados de la Carrera</h3>
            <table>
                <thead>
                    <tr><th>Pos</th><th>Piloto</th><th>Escudería</th><th>Pts</th></tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const PARRILLA = {
            "McLaren": ["Lando Norris", "Oscar Piastri"],
            "Ferrari": ["Charles Leclerc", "Lewis Hamilton"],
            "Mercedes": ["George Russell", "Kimi Antonelli"],
            "Red Bull Racing": ["Max Verstappen", "Isack Hadjar"],
            "Williams": ["Alex Albon", "Carlos Sainz"],
            "Audi": ["Nico Hülkenberg", "Gabriel Bortoleto"],
            "Alpine": ["Pierre Gasly", "Franco Colapinto"],
            "Haas": ["Oliver Bearman", "Esteban Ocon"],
            "Racing Bulls": ["Liam Lawson", "Arvid Lindblad"],
            "Aston Martin": ["Fernando Alonso", "Lance Stroll"],
            "Cadillac": ["Sergio Pérez", "Valtteri Bottas"]
        };

        const PUNTOS_F1 = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

        let miEscuderia = "";
        let miPiloto = "";
        let rp = 0;
        let carreraActual = 1;
        let componentes = { "Alerones": 1, "Motor": 1, "Frenos": 1, "Suspensión": 1 };

        function init() {
            const teamSelect = document.getElementById("team-select");
            for (let team in PARRILLA) {
                let opt = document.createElement("option");
                opt.value = team;
                opt.innerText = team;
                teamSelect.appendChild(opt);
            }
            cargarPilotos();
        }

        function cargarPilotos() {
            const team = document.getElementById("team-select").value;
            const driverSelect = document.getElementById("driver-select");
            driverSelect.innerHTML = "";
            PARRILLA[team].forEach(driver => {
                let opt = document.createElement("option");
                opt.value = driver;
                opt.innerText = driver;
                driverSelect.appendChild(opt);
            });
        }

        function iniciarJuego() {
            miEscuderia = document.getElementById("team-select").value;
            miPiloto = document.getElementById("driver-select").value;
            
            document.getElementById("setup-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("user-info").innerText = `${miEscuderia} | ${miPiloto}`;
            
            renderTaller();
        }

        function renderTaller() {
            document.getElementById("rp-display").innerText = `Puntos de Desarrollo (RP): ${rp}`;
            const container = document.getElementById("upgrades-list");
            container.innerHTML = "";
            
            for (let comp in componentes) {
                let nivel = componentes[comp];
                let costo = nivel * 50;
                let div = document.createElement("div");
                div.className = "stat-grid";
                div.innerHTML = `
                    <div class="stat-item"><b>${comp}</b><br>Nivel: ${nivel}</div>
                    <button class="btn btn-upgrade" ${rp < costo ? 'disabled' : ''} onclick="mejorar('${comp}', ${costo})">
                        Mejorar (${costo} RP)
                    </button>
                `;
                container.appendChild(div);
            }
        }

        function mejorar(comp, costo) {
            if (rp >= costo) {
                rp -= costo;
                componentes[comp]++;
                renderTaller();
            }
        }

        function simularCarrera() {
            let competidores = [];
            let rendimientoTotal = Object.values(componentes).reduce((a, b) => a + b, 0);

            for (let esc in PARRILLA) {
                PARRILLA[esc].forEach(piloto => {
                    let bonus = (piloto === miPiloto) ? rendimientoTotal * 3 : Math.floor(Math.random() * 10);
                    let score = Math.floor(Math.random() * 50) + 50 + bonus;
                    competidores.push({ piloto, escuderia: esc, score });
                });
            }

            competidores.sort((a, b) => b.score - a.score);

            const tbody = document.getElementById("results-body");
            tbody.innerHTML = "";
            let posJugador = 0;

            competidores.forEach((c, index) => {
                let pos = index + 1;
                let pts = PUNTOS_F1[index] || 0;
                let row = document.createElement("tr");
                if (c.piloto === miPiloto) {
                    row.className = "user-row";
                    posJugador = pos;
                }
                row.innerHTML = `<td>P${pos}</td><td>${c.piloto}</td><td>${c.escuderia}</td><td>+${pts}</td>`;
                tbody.appendChild(row);
            });

            let ganados = Math.max(1, 23 - posJugador) * 15;
            rp += ganados;
            carreraActual++;
            
            document.getElementById("results-card").classList.remove("hidden");
            renderTaller();
        }

        init();
    </script>
</body>
</html>
